<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
  <main class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Sign in to continue</p>

    <form class="sign-in-form">
      <label class="input-group">
        <input type="text" class="user-name" placeholder="Email or username" autocomplete="username" required>
      </label>
      <label class="input-group">
        <input type="password" class="password" placeholder="Password" autocomplete="current-password" required>
      </label>

      <button type="submit" class="btnsubmit">Sign In </button>
      <p class="auth-message" role="status"></p>
    </form>

    <p class="switch-statement">
      Don't have an account?
      <button type="button" class="switch-login-btn">Sign Up</button>
    </p>
  </main>
  <script src="index.js"></script>
</body>

</html>
